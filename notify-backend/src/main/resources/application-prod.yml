# ═══════════════════════════════════════════════════════════════
#  NotifyFlow — Production Profile
#  Overrides application.yml for production deployments.
#  Activate with: SPRING_PROFILES_ACTIVE=prod
# ═══════════════════════════════════════════════════════════════

spring:

  # ── DataSource — tuned for production load ─────────────────
  datasource:
    hikari:
      maximum-pool-size:    25
      minimum-idle:         5
      idle-timeout:         600000    # 10 min
      connection-timeout:   10000     # 10s (fail fast)
      max-lifetime:         1800000   # 30 min
      leak-detection-threshold: 60000 # 60s — detect connection leaks

  # ── JPA ────────────────────────────────────────────────────
  jpa:
    show-sql: false   # Never show SQL in production
    properties:
      hibernate:
        format_sql: false

  # ── Redis — shorter timeouts ───────────────────────────────
  data:
    redis:
      timeout:  1000ms
      lettuce:
        pool:
          max-active:  16
          max-idle:    8
          min-idle:    2
          max-wait:    500ms

  # ── Kafka — stricter delivery guarantees ──────────────────
  kafka:
    producer:
      acks:     all
      retries:  5
    consumer:
      group-id: notifyflow-consumer-group-prod

# ── Server ───────────────────────────────────────────────────
server:
  error:
    include-stacktrace: never

# ── Logging — WARN by default, INFO for app ────────────────
logging:
  level:
    root:                               WARN
    com.notifyflow:                     INFO
    org.apache.kafka:                   WARN
    org.springframework.kafka:          WARN
    org.hibernate.SQL:                  WARN
    org.flywaydb:                       WARN

# ── Swagger — disabled in production ─────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
